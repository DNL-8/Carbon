name: Murim CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  application:
    name: Aplicação · FastAPI + Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: murim_fastapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MURIM_REWARDS_ORACLE: /tmp/murim-rewards-oracle.json
      MURIM_EQUIPMENT_ORACLE: /tmp/murim-equipment-oracle.json
      MURIM_PROGRESSION_ORACLE: /tmp/murim-progression-oracle.json
      MURIM_TEST_DATABASE_URL: postgresql://ci:local-test-only@127.0.0.1:5432/murim_fastapi_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node ../scripts/check-fastapi-catalog.mjs
      - run: node ../scripts/check-fastapi-progression.mjs > "$MURIM_PROGRESSION_ORACLE"
      - run: node ../scripts/check-fastapi-equipment.mjs > "$MURIM_EQUIPMENT_ORACLE"
      - run: node ../scripts/check-fastapi-rewards.mjs > "$MURIM_REWARDS_ORACLE"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Inicializar banco descartável via Alembic
        run: |
          export MURIM_MIGRATION_DATABASE_URL="$MURIM_TEST_DATABASE_URL"
          MURIM_BOOTSTRAP_EMPTY=1 uv run alembic upgrade head
          uv run alembic check
      - name: Testar inicialização e preservação do schema Alembic
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" psql -U ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE murim_bootstrap_test'
          export MURIM_MIGRATION_DATABASE_URL="${MURIM_TEST_DATABASE_URL%/*}/murim_bootstrap_test"
          uv run python scripts/check_bootstrap.py
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Auditar dependências Python de produção
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --format requirements-txt --output-file /tmp/murim-python-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --no-deps --disable-pip -r /tmp/murim-python-requirements.txt
      - run: docker build -t murim-fastapi:ci .
      - name: Validar inicialização do contêiner
        run: |
          docker run -d --name fastapi-ci -p 127.0.0.1:8000:8000 murim-fastapi:ci
          trap 'docker logs fastapi-ci; docker rm -f fastapi-ci >/dev/null' EXIT
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/api/health | jq -e '.status == "ok"'
      # Temporário nesta branch: gerar o lockfile em ambiente Bun real, sem permissões de escrita.
      - name: Resolver lockfile MUI X Charts
        working-directory: frontend
        run: |
          bun install --lockfile-only
          echo MURIM_LOCKFILE_START
          base64 -w 1000 bun.lock
          echo MURIM_LOCKFILE_END
      - name: Guardar lockfile gerado
        uses: actions/upload-artifact@v7
        with:
          name: mui-charts-bun-lock
          path: frontend/bun.lock
          retention-days: 3
      - name: Compilar Next.js e testar desktop/mobile
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun audit --production --audit-level high
          bun run generate:api
          git diff --exit-code -- lib/api.generated.ts
          bun run typecheck
          bun run build
          bunx playwright install --with-deps chromium
          bun run test
      - name: Guardar relatórios de falha do Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: murim-playwright-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android · testes e APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: 'false'
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon -PfitnessApiOrigin=https://murim-ci.example.test
        working-directory: android
