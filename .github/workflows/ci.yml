name: Verificacao do App-fitness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Tipos, testes e compilacao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Auditar dependencias de producao
        run: bun audit --production --audit-level high
      - name: Verificar tipos TypeScript
        run: bun run lint
      - name: Executar testes
        env:
          POSTGRES_TEST_URL: postgres://ci:local-test-only@127.0.0.1:5432/fitness_test
        run: bun run test
      - name: Testar a entrada da funcao
        run: bun run test:entry
      - name: Compilar para producao
        run: bun run build
      - name: Testar o build e os fluxos no navegador
        run: bun run test:browser

  android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: 'false'
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon -PfitnessApiOrigin=https://murim-ci.example.test
        working-directory: android
