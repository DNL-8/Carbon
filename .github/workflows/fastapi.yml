name: FastAPI
on:
  push:
    branches: [migration/fastapi, main]
    paths: ['backend/**', 'web/**', '.github/workflows/fastapi.yml', 'src/utils/**', 'src/server/**', 'scripts/check-fastapi-*.mjs', 'bun.lock', 'package.json']
  pull_request:
    paths: ['backend/**', 'web/**', '.github/workflows/fastapi.yml', 'src/utils/**', 'src/server/**', 'scripts/check-fastapi-*.mjs', 'bun.lock', 'package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: murim_fastapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MURIM_REWARDS_ORACLE: /tmp/murim-rewards-oracle.json
      MURIM_EQUIPMENT_ORACLE: /tmp/murim-equipment-oracle.json
      MURIM_PROGRESSION_ORACLE: /tmp/murim-progression-oracle.json
      MURIM_TEST_DATABASE_URL: postgresql://ci:local-test-only@127.0.0.1:5432/murim_fastapi_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node ../scripts/check-fastapi-catalog.mjs
      - run: node ../scripts/check-fastapi-progression.mjs > "$MURIM_PROGRESSION_ORACLE"
      - run: node ../scripts/check-fastapi-equipment.mjs > "$MURIM_EQUIPMENT_ORACLE"
      - run: node ../scripts/check-fastapi-rewards.mjs > "$MURIM_REWARDS_ORACLE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: DATABASE_URL_DIRECT="$MURIM_TEST_DATABASE_URL" bun run db:migrate
        working-directory: .
      - name: Verificar adoção e reversão do baseline Alembic
        run: |
          export MURIM_MIGRATION_DATABASE_URL="$MURIM_TEST_DATABASE_URL"
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: docker build -t murim-fastapi:ci .
      - name: Validar inicialização do contêiner
        run: |
          docker run -d --name fastapi-ci -p 127.0.0.1:8000:8000 murim-fastapi:ci
          trap 'docker logs fastapi-ci; docker rm -f fastapi-ci >/dev/null' EXIT
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/api/health | jq -e '.status == "ok"'
      - run: bun run build:nuxt
        working-directory: .
        env:
          NITRO_PRESET: node-server
      - run: bunx playwright-core install --with-deps chromium
        working-directory: .
      - run: node scripts/check-fastapi-http.mjs --browser
        working-directory: .
