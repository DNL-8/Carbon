name: Verificar revisão publicada do Murim
on:
  workflow_dispatch:
    inputs:
      revision:
        description: SHA completo do commit publicado na Vercel
        type: string
        required: true

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-production.mjs
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
