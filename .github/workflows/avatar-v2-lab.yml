name: Avatar V2 GLB lab
on:
  push:
    branches: ['feature/avatar-v2-glb']
    paths:
      - 'frontend/**'
      - 'src/**'
      - '.github/workflows/avatar-v2-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rig: [rigid, skinned, blender]
    env:
      AVATAR_LAB_RIG: ${{ matrix.rig }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun add --exact three@0.186.0 @react-three/fiber@9.8.2
      - run: bun add -d --exact @types/three@0.186.0
      - run: python -m pip install numpy==2.3.5 trimesh==4.11.1 scipy networkx==3.5
      - run: python experiments/avatar-v2/generate_models.py
      - run: python experiments/avatar-v2/validate_models.py
      - run: python experiments/avatar-v2/validate_art_budget.py .
      - if: matrix.rig != 'rigid'
        run: |
          python experiments/avatar-v2/skin_models.py
          python experiments/avatar-v2/validate_skin.py skinned
      - name: Exportar modelos pelo Blender
        if: matrix.rig == 'blender'
        working-directory: frontend/experiments/avatar-v2
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-numpy
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH /usr/bin/blender --version
          env -u LD_LIBRARY_PATH -u PYTHONHOME PYTHONPATH=/usr/lib/python3/dist-packages /usr/bin/blender -b --factory-startup --python-use-system-env --python-exit-code 1 --python blender_rig.py -- "$PWD"
          python validate_skin.py blender-output
          python validate_art_budget.py blender-output
      - run: node experiments/avatar-v2/prepare.mjs
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Preparar rota de teste isolada
        run: |
          mkdir -p app/avatar-v2-lab-test
          cp experiments/avatar-v2/test-page.tsx.in app/avatar-v2-lab-test/page.tsx
          cp experiments/avatar-v2/playwright.config.ts.in experiments/avatar-v2/playwright.config.ts
          cp experiments/avatar-v2/glb-smoke.spec.ts.in experiments/avatar-v2/glb-smoke.spec.ts
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: bunx playwright install --with-deps chromium
      - name: Homologar GLB nos dois personagens em desktop e mobile
        run: bunx playwright test --config experiments/avatar-v2/playwright.config.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: avatar-v2-browser-results-${{ matrix.rig }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always() && matrix.rig == 'blender'
        with:
          name: avatar-v2-blender-source
          path: frontend/experiments/avatar-v2/blender-output/*.blend
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: avatar-v2-prepared-${{ matrix.rig }}
          path: |
            frontend/package.json
            frontend/bun.lock
            frontend/components/avatar-glb-preview.tsx
            frontend/components/arsenal.tsx
            frontend/public/assets/avatar-v2/*.glb
          retention-days: 7

  arsenal:
    name: Integração Avatar V2 · Arsenal autenticado
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: murim_fastapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MURIM_TEST_DATABASE_URL: postgresql://ci:local-test-only@127.0.0.1:5432/murim_fastapi_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/download-artifact@v7
        with:
          name: avatar-v2-prepared-blender
          path: frontend
      - name: Preparar PostgreSQL descartável
        working-directory: backend
        run: |
          python -m pip install uv
          uv sync --locked
          MURIM_MIGRATION_DATABASE_URL="$MURIM_TEST_DATABASE_URL" MURIM_BOOTSTRAP_EMPTY=1 uv run alembic upgrade head
          MURIM_MIGRATION_DATABASE_URL="$MURIM_TEST_DATABASE_URL" uv run alembic check
      - name: Validar integração no frontend real, sem rota de laboratório
        working-directory: frontend
        run: |
          test -f public/assets/avatar-v2/murim.glb
          test -f public/assets/avatar-v2/cacador.glb
          test ! -e app/avatar-v2-lab-test
          cp experiments/avatar-v2/arsenal-glb.spec.ts.in tests/arsenal-glb.spec.ts
          bun install --frozen-lockfile
          bun audit --production --audit-level high
          bun run lint
          bun run typecheck
          bun run build
          bunx playwright install --with-deps chromium
          bun run test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: avatar-v2-arsenal-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: avatar-v2-integration-candidate
          path: |
            frontend/package.json
            frontend/bun.lock
            frontend/components/avatar-glb-preview.tsx
            frontend/components/arsenal.tsx
            frontend/public/assets/avatar-v2/*.glb
            frontend/tests/arsenal-glb.spec.ts
          if-no-files-found: error
          retention-days: 14
