name: Avatar V2 GLB lab
on:
  push:
    branches: ['feature/avatar-v2-glb']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun add --exact three@0.186.0 @react-three/fiber@9.8.2
      - run: bun add -d --exact @types/three@0.186.0
      - run: python -m pip install numpy==2.3.5 trimesh==4.11.1 scipy networkx==3.5
      - run: python experiments/avatar-v2/generate_models.py
      - run: python experiments/avatar-v2/validate_models.py
      - run: node experiments/avatar-v2/prepare.mjs
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: avatar-v2-prepared
          path: |
            frontend/package.json
            frontend/bun.lock
            frontend/components/avatar-glb-preview.tsx
            frontend/components/arsenal.tsx
            frontend/public/assets/avatar-v2/*.glb
          retention-days: 7
