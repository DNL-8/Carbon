name: Transferir candidato Avatar V2
on:
  push:
    branches: ['feature/avatar-v2-transfer']
    paths: ['.github/workflows/avatar-v2-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.repository == 'DNL-8/Carbon' && github.ref == 'refs/heads/feature/avatar-v2-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: avatar-v2-prepared-blender
          run-id: 46154383597
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/avatar-candidate
      - name: Conferir e importar somente os seis arquivos esperados
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avatar-candidate"
          sha256sum -c <<'CHECKSUMS'
          6adc38796e671be33b90da0622d28c840f5549d03eaca1c047ed6f8fedabcea1  bun.lock
          312d5abf807258efb4c5ba32d22b650dea37784156388716138fa36383a466ea  components/avatar-glb-preview.tsx
          00be2adb3cae9adef39e97170925ee907daf63f7ac95a48ac27dd54994d6ee47  package.json
          bbdcb9064c43cecf70b593b1d06476ad7ba3f45f782de3ecec50c11a247cf55f  components/arsenal.tsx
          1a1cdf3f8063ed27ec4febe5fa6f47a538611b384dd3919fcb1f95812739326b  public/assets/avatar-v2/cacador.glb
          e582decaa643d5e6591569004aa3fdff3385ceefc2b6a79a9a9367b7dd51433a  public/assets/avatar-v2/murim.glb
          CHECKSUMS
          for file in package.json bun.lock components/avatar-glb-preview.tsx components/arsenal.tsx public/assets/avatar-v2/cacador.glb public/assets/avatar-v2/murim.glb; do
            install -D -m 644 "$file" "$GITHUB_WORKSPACE/frontend/$file"
          done
          cd "$GITHUB_WORKSPACE"
          cp frontend/experiments/avatar-v2/arsenal-glb.spec.ts.in frontend/tests/arsenal-glb.spec.ts
          git add frontend/package.json frontend/bun.lock frontend/components/avatar-glb-preview.tsx frontend/components/arsenal.tsx frontend/public/assets/avatar-v2/cacador.glb frontend/public/assets/avatar-v2/murim.glb frontend/tests/arsenal-glb.spec.ts
          git rm .github/workflows/avatar-v2-transfer.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(avatar): import verified Blender candidate and integration tests'
      - name: Enviar apenas para branch temporária
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/avatar-v2-transfer'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/avatar-v2-transfer
