name: Next.js frontend
on:
  pull_request:
    paths: ['frontend/**', 'backend/**', 'web/**', 'src/types/fitness.ts', 'src/utils/**', '.github/workflows/next-frontend.yml']
  push:
    branches: [main, migration/next-frontend, migration/python-auth]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: murim_fastapi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MURIM_TEST_DATABASE_URL: postgresql://ci:local-test-only@127.0.0.1:5432/murim_fastapi_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --locked
        working-directory: backend
      - run: bun install --frozen-lockfile
      - run: DATABASE_URL_DIRECT="$MURIM_TEST_DATABASE_URL" bun run db:migrate
      - run: bun run build:nuxt
        env:
          NITRO_PRESET: node-server
      - working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run generate:api
          git diff --exit-code -- lib/api.generated.ts
          bun run typecheck
          bun run build
          bunx playwright install --with-deps chromium
          bun run test
