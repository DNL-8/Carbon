name: Legado · verificação do Nuxt e restauração
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        preset: [node-server, vercel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:nuxt
        if: matrix.preset == 'node-server'
      - run: bun run lint:nuxt
        if: matrix.preset == 'node-server'
      - run: bun run test:nuxt:unit
        if: matrix.preset == 'node-server'
      - run: bun run build:nuxt
        if: matrix.preset == 'node-server'
        env:
          NITRO_PRESET: node-server
      - name: Validar comando real de deploy Vercel
        if: matrix.preset == 'vercel'
        run: bash -ec "$(node -p 'require(\"./vercel.json\").buildCommand')"
        shell: bash
      - name: Instalar Chromium para os testes
        if: matrix.preset == 'node-server'
        run: bunx playwright-core install --with-deps chromium
      - name: Testar treino e importação no navegador
        if: matrix.preset == 'node-server'
        run: bun run test:nuxt --browser
        env:
          MURIM_CAPTURE_DIR: ${{ runner.temp }}/murim-capturas
          MURIM_ANIMATION_DIR: ${{ runner.temp }}/murim-capturas
      - name: Guardar capturas e clipes com dados de teste
        if: matrix.preset == 'node-server' && success()
        uses: actions/upload-artifact@v4
        with:
          name: murim-capturas
          path: ${{ runner.temp }}/murim-capturas

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.nuxt -t app-fitness:ci .
      - name: Testar container
        shell: bash
        run: |
          docker run -d --name fitness-ci -p 127.0.0.1:3000:3000 app-fitness:ci
          trap 'docker logs fitness-ci || true; docker rm -f fitness-ci >/dev/null || true' EXIT
          curl --fail --silent --show-error --max-time 3 --retry 15 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/api/health | jq -e '.status == "ok"'

  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: fitness_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d fitness_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Aplicar migrações
        env:
          DATABASE_URL_DIRECT: postgres://ci:local-test-only@127.0.0.1:5432/fitness_source
        run: bun run db:migrate
      - name: Instalar age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Criptografar e restaurar banco de teste
        shell: bash
        env:
          PGDATABASE: postgres://ci:local-test-only@127.0.0.1:5432/fitness_source
          RESTORE_DATABASE: postgres://ci:local-test-only@127.0.0.1:5432/fitness_restored
        run: |
          docker run --rm --network host -e PGDATABASE postgres:18 psql "$PGDATABASE" -X -v ON_ERROR_STOP=1 \
            -c "INSERT INTO auth_user (id, name, email) VALUES ('fixture', 'Fixture', 'fixture@example.com')" \
            -c "INSERT INTO fitness_progress (user_id, xp, coins) VALUES ('fixture', 42, 7)" \
            -c 'CREATE DATABASE fitness_restored'
          key="$RUNNER_TEMP/backup-test.agekey"
          dump="$RUNNER_TEMP/backup-test.dump.age"
          trap 'rm -f "$key" "$dump"' EXIT
          age-keygen -o "$key"
          export AGE_RECIPIENT="$(age-keygen -y "$key")"
          bash scripts/nuxt-backup.sh "$dump"
          age --decrypt -i "$key" "$dump" \
            | docker run --rm -i --network host postgres:18 pg_restore --exit-on-error --no-owner --no-acl --dbname="$RESTORE_DATABASE"
          balance="$(docker run --rm --network host postgres:18 psql "$RESTORE_DATABASE" -XAt -v ON_ERROR_STOP=1 \
            -c "SELECT xp, coins FROM fitness_progress WHERE user_id = 'fixture'")"
          test "$balance" = '42|7'
