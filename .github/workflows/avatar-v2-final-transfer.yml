name: Transferir Avatar V2 aprovado
on:
  push:
    branches: ['feature/avatar-v2-final-publish']
    paths: ['.github/workflows/avatar-v2-final-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.repository == 'DNL-8/Carbon' && github.ref == 'refs/heads/feature/avatar-v2-final-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirmar aprovação e origem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/DNL-8/Carbon/actions/runs/46163338738 --jq .conclusion)" = success
          test "$(gh api repos/DNL-8/Carbon/actions/runs/46163338738 --jq .head_sha)" = 'be9fdf25626a6889a0687bc8b2d67e89c094ab97'
      - uses: actions/download-artifact@v7
        with:
          name: avatar-v2-integration-candidate
          run-id: 46163338738
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/avatar-candidate
      - name: Verificar hashes e importar somente modelos e visualizador
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avatar-candidate"
          sha256sum -c <<'CHECKSUMS'
          996a75ca8df20ccee30820fdda52a226c616be032c5fb2b5b99916af5218128e  components/avatar-glb-preview.tsx
          d909263b6528bd755042f64b951ab37fff1b48de12529ecffd84dcbb74e4ee4d  public/assets/avatar-v2/cacador.glb
          3ce7afc3a1cbeb4cfc232cb1e5aef79e0536df5818b660754e2cd3547e381271  public/assets/avatar-v2/murim.glb
          CHECKSUMS
          cmp package.json "$GITHUB_WORKSPACE/frontend/package.json"
          cmp bun.lock "$GITHUB_WORKSPACE/frontend/bun.lock"
          for file in components/avatar-glb-preview.tsx public/assets/avatar-v2/cacador.glb public/assets/avatar-v2/murim.glb; do
            install -D -m 644 "$file" "$GITHUB_WORKSPACE/frontend/$file"
          done
          cd "$GITHUB_WORKSPACE"
          git add frontend/components/avatar-glb-preview.tsx frontend/public/assets/avatar-v2/cacador.glb frontend/public/assets/avatar-v2/murim.glb
          git rm .github/workflows/avatar-v2-final-transfer.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(avatar): importar modelos e renderizador homologados'
      - name: Enviar exclusivamente à branch de publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/avatar-v2-final-publish'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/avatar-v2-final-publish
