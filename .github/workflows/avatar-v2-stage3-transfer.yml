name: Transferir revisão aprovada Avatar V2
on:
  push:
    branches: ['feature/avatar-v2-stage3-publish']
    paths: ['.github/workflows/avatar-v2-stage3-transfer.yml']
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    if: github.repository == 'DNL-8/Carbon' && github.ref == 'refs/heads/feature/avatar-v2-stage3-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirmar aprovação e origem do artefato
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/DNL-8/Carbon/actions/runs/46156191078 --jq .conclusion)" = success
          test "$(gh api repos/DNL-8/Carbon/actions/runs/46156191078 --jq .head_sha)" = '56c322707b89363bd21a52109d353c84bbaee7b8'
      - uses: actions/download-artifact@v7
        with:
          name: avatar-v2-integration-candidate
          run-id: 46156191078
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/avatar-candidate
      - name: Verificar hashes e importar somente visualizador e modelos
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avatar-candidate"
          sha256sum -c <<'CHECKSUMS'
          14596e3adedb500c7b2627266dabe763ee2d2e1b0fc0c02e5456faf65cd17cd7  components/avatar-glb-preview.tsx
          f0c8bde33f285c6f5b04b366256f56a72b7fc6affca11e6669ba4d2f20ceb1c1  public/assets/avatar-v2/cacador.glb
          4f303b4062652b32f8f2f761d204e2ad3cf93011a1d3b6ad8a946ce37f702832  public/assets/avatar-v2/murim.glb
          CHECKSUMS
          cmp package.json "$GITHUB_WORKSPACE/frontend/package.json"
          cmp bun.lock "$GITHUB_WORKSPACE/frontend/bun.lock"
          for file in components/avatar-glb-preview.tsx public/assets/avatar-v2/cacador.glb public/assets/avatar-v2/murim.glb; do
            install -D -m 644 "$file" "$GITHUB_WORKSPACE/frontend/$file"
          done
          cd "$GITHUB_WORKSPACE"
          git add frontend/components/avatar-glb-preview.tsx frontend/public/assets/avatar-v2/cacador.glb frontend/public/assets/avatar-v2/murim.glb
          git rm .github/workflows/avatar-v2-stage3-transfer.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(avatar): import approved refined GLBs and renderer'
      - name: Enviar somente para branch de publicação
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/feature/avatar-v2-stage3-publish'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/avatar-v2-stage3-publish
